<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Measure your CPU's effective clock, then race the global leaderboard">
<title>CPU Race</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #141414;
    --muted: #6b6b6b;
    --faint: #9a9a9a;
    --line: #e4e4e4;
    --rule: #141414;
    --you: #7a5c00;
    --you-bg: #fdf5dd;
    --warn: #a8001c;
    --warn-bg: #fff4f4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e10;
      --fg: #e8e8e8;
      --muted: #8e8e8e;
      --faint: #6a6a6a;
      --line: #24242a;
      --rule: #4a4a52;
      --you: #e3b951;
      --you-bg: #221d0e;
      --warn: #ff8f8f;
      --warn-bg: #2a1416;
      color-scheme: dark;
    }
  }
  * {
    box-sizing: border-box;
  }
  [hidden] {
    display: none !important;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 46em;
    margin: 0 auto;
    padding: 2.5em 1.25em 3em;
  }

  .label {
    color: var(--faint);
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    margin-bottom: .7em;
  }

  .hero {
    margin-bottom: 1.5em;
  }
  .readout {
    display: flex;
    align-items: baseline;
    gap: .18em;
    line-height: 1;
  }
  .readout .num {
    font-size: clamp(44px, 15vw, 68px);
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .readout .unit {
    font-size: clamp(15px, 4vw, 20px);
    color: var(--muted);
    font-weight: 400;
    margin-left: .5em;
  }

  progress {
    appearance: none;
    -webkit-appearance: none;
    display: block;
    width: 100%;
    height: 2px;
    border: 0;
    margin: 1.4em 0 1em;
    background: var(--line);
  }
  progress::-webkit-progress-bar {
    background: var(--line);
  }
  progress::-webkit-progress-value {
    background: var(--fg);
  }
  progress::-moz-progress-bar {
    background: var(--fg);
  }

  .state {
    display: flex;
    align-items: baseline;
    gap: .6em;
    color: var(--muted);
  }
  .badge {
    display: inline-block;
    background: var(--you);
    color: var(--bg);
    font-weight: 700;
    padding: .1em .5em;
    letter-spacing: .04em;
  }

  .warn {
    border-left: 3px solid var(--warn);
    background: var(--warn-bg);
    color: var(--warn);
    padding: .65em .85em;
    margin: 1.25em 0;
  }

  .profile {
    margin: 2.25em 0;
  }
  .profile svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .profile polyline {
    stroke: var(--fg);
    stroke-width: 1.2;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  .profile .dot-a {
    fill: var(--faint);
  }
  .profile .dot-b {
    fill: var(--fg);
  }
  #chartTip {
    position: fixed;
    z-index: 1;
    padding: .2em .5em;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--fg);
    font-size: 11px;
    white-space: nowrap;
    pointer-events: none;
  }

  .board {
    margin-top: 2.5em;
  }
  .board-scroll {
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  th {
    font-weight: 400;
    color: var(--muted);
    text-align: right;
    padding: .45em .6em;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  td {
    text-align: right;
    padding: .42em .6em;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  th:first-child, td:first-child {
    text-align: left;
    width: 1%;
    color: var(--faint);
  }
  th:nth-child(3), td:nth-child(3) {
    padding-right: 1.4em;
  }
  th:nth-child(4), td:nth-child(4), th:nth-child(5), td:nth-child(5) {
    text-align: left;
  }
  tbody tr:hover td {
    background: color-mix(in srgb, var(--fg) 4%, transparent);
  }
  tr.highlight td {
    background: var(--you-bg);
    color: var(--you);
    font-weight: 700;
    border-bottom-color: var(--you-bg);
  }
  tr.highlight td:first-child {
    box-shadow: inset 3px 0 0 var(--you);
    color: var(--you);
  }

  @media (max-width: 560px) {
    main {
      padding: 1.75em 1em 2.5em;
    }
    th:nth-child(5), td:nth-child(5) {
      display: none;
    }
    th, td {
      padding: .42em .35em;
    }
    table {
      font-size: 12px;
    }
  }

  footer {
    margin-top: 3em;
    padding-top: 1.25em;
    border-top: 1px solid var(--line);
    font-size: 12px;
  }
  footer a {
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }
  footer a:hover {
    color: var(--fg);
    border-bottom-color: var(--fg);
  }

</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="label">Effective clock</div>
    <div class="readout">
      <span class="num" id="txtSpeed">0</span><span class="unit">GHz</span>
    </div>
    <progress id="progressBar" max="1" value="0"></progress>
    <div class="state">
      <span class="badge" id="badge" hidden></span>
      <span id="txtState">Warming up...</span>
    </div>
  </section>

  <div class="warn" id="visibilityWarn" hidden>
    Tab switching detected! Measured values may be lower than reality. Reload to try again.
  </div>

  <section class="profile" id="profileSec" hidden>
    <div class="label">Run profile &middot; 20 chunks<span id="rangeTxt"></span></div>
    <svg id="chart" viewBox="0 0 240 46" preserveAspectRatio="none" role="img"
         aria-label="Equivalent clock across the 20 timed chunks"></svg>
    <div id="chartTip" hidden></div>
  </section>

  <section class="board">
    <div class="label">Leaderboard</div>
    <div class="board-scroll">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Total time</th>
            <th>Est. clock</th>
            <th>Location</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="tableRank"></tbody>
      </table>
    </div>
  </section>

  <footer>
    <a href="https://github.com/EtherDream/cpu-race">GitHub</a>
  </footer>
</main>

<script>
  const TOTAL_ITERS = 2.5e9
  const ITERS_PER_CALL = TOTAL_ITERS / 20
  const CYCLES_PER_ITER = 40

  const EDGE_URL = 'wss://cpu-race-cfworker.etherdream.com/v1'
  // const EDGE_URL = 'ws://localhost:8787/v1'

  const workerEnv = () => {
    const wasmB64 = 'AGFzbQEAAAABCQFgA35+fwJ+fgMCAQAHCQEFc29sdmUAAArAAQG9AQADQCAAIAGFQpXfi/S9qImaUX5CEYkhACABIACFQqOpz6HtxemZywB+QhOJIQEgACABhULTrdSykoW1tJ5/fkIViSEAIAEgAIVCpfGx08q545otfkIXiSEBIAAgAYVCldPH3rXyqdJGfkIZiSEAIAEgAIVCs+uwxNyUtJJLfkIbiSEBIAAgAYVCxc/ZsvHluuonfkIdiSEAIAEgAIVCrf7V5NSF/ajYAH5CH4khASACQQFrIgINAAsgACABCw=='
    const wasmBin = Uint8Array.from(atob(wasmB64), c => c.charCodeAt(0))
    const {solve} = new WebAssembly.Instance(new WebAssembly.Module(wasmBin)).exports

    onmessage = (e) => {
      let [a, b] = e.data

      for (let done = 0; done < TOTAL_ITERS; done += ITERS_PER_CALL) {
        const t0 = performance.now()
        ; [a, b] = solve(a, b, ITERS_PER_CALL)
        const t1 = performance.now()

        postMessage(t1 - t0)
      }
      postMessage({
        type: 'done',
        a: a & 0xFFFFFFFFFFFFFFFFn,
        b: b & 0xFFFFFFFFFFFFFFFFn,
      })
    }
    // warmup
    solve(1n, 1n, 1e7)
    postMessage({type: 'ready'})
  }

  const workerCode = `
    const TOTAL_ITERS = ${TOTAL_ITERS}
    const ITERS_PER_CALL = ${ITERS_PER_CALL}
    ;(${workerEnv})()
  `
  const worker = new Worker(
    URL.createObjectURL(new Blob([workerCode]))
  )
  const toGhz = (iter, ms) => iter * CYCLES_PER_ITER / ms / 1e6

  const chunks = []
  let msgId = 0
  let ws
  let rtt

  let readyTimer = setTimeout(() => {
    setState('Worker failed to start')
  }, 5000)

  // covers what an in-worker try/catch never can: parse errors (BigInt SyntaxError),
  // wasm CompileError at top level, and crashes mid-run inside onmessage
  worker.onerror = (e) => {
    clearTimeout(readyTimer)
    setState('Worker failed: ' + e.message)
  }

  function setState(text) {
    txtState.textContent = text
  }

  worker.onmessage = (e) => {
    const msg = e.data

    if (typeof msg === 'number') {
      txtSpeed.textContent = toGhz(ITERS_PER_CALL, msg).toFixed(2)
      progressBar.value += ITERS_PER_CALL
      chunks.push(msg)
      return
    }
    switch (msg.type) {
    case 'ready':
      clearTimeout(readyTimer)
      connect()
      break
    case 'done':
      submit(msg.a, msg.b)
      break
    }
  }

  function connect() {
    setState('Connecting to server...')
    ws = new WebSocket(EDGE_URL)
    ws.binaryType = 'arraybuffer'
    ws.onclose = () => {}
    ws.onerror = () => {
      setState('Connection failed, reload to retry')
    }
    ws.onmessage = (e) => {
      const msg = e.data

      // wire order: 0 question (binary) / 1 leaderboard / 2 RTT ack / 3 result or error
      switch (msgId++) {
      case 0:
        start(new BigUint64Array(msg))
        break
      case 1:
        updateRankTable(JSON.parse(msg))
        break
      case 2:
        // The edge service replies with an empty message as soon as it receives the
        // answer, which lets us measure the RTT. Note this is the RTT of the answer
        // submission only; strictly we should measure question dispatch → answer submit.
        rtt = Date.now() - rtt
        break
      case 3:
        complete(JSON.parse(msg))
        break
      }
    }
  }

  function start(ques) {
    worker.postMessage(ques)
    chunks.length = 0

    document.onvisibilitychange = () => {
      visibilityWarn.hidden = false
    }
    progressBar.max = TOTAL_ITERS
    progressBar.value = 0
    setState('Measuring CPU speed...')
  }

  function submit(a, b) {
    ws.send(BigUint64Array.of(a, b))
    setState('Submitting...')
    document.onvisibilitychange = null
    rtt = Date.now()
  }

  function complete(json) {
    drawProfile()
    if (json.error) {
      setState(json.error)
      return
    }
    const prefix = `${json.duration} ms (incl. ${rtt} ms RTT)`
    if (json.rank === 0) {
      setState(prefix + ' — not ranked')
      return
    }
    badge.textContent = '#' + json.rankIndex
    badge.hidden = false
    setState(prefix)
    updateRankTable(json.rank, json.rankIndex)
  }

  function updateRankTable(rank, rankIndex = 0) {
    tableRank.innerHTML = ''

    rank.forEach((item, index) => {
      const row = document.createElement('tr')
      if (index + 1 === rankIndex) {
        row.className = 'highlight'
      }
      const ghz = toGhz(TOTAL_ITERS, item.duration).toFixed(2) + ' GHz'
      const duration = item.duration + ' ms'
      const date = new Date(item.date)
      const dateShort = date.toLocaleDateString()

      for (const v of [index + 1, duration, ghz, item.geo, dateShort]) {
        const td = document.createElement('td')
        td.textContent = v
        row.appendChild(td)
      }
      row.lastChild.title = date.toLocaleString()
      tableRank.appendChild(row)
    })
  }

  // drawn once, after submit: the y-axis is zoomed to the data range, so the range is
  // printed in the section label. The scale is padded so no point touches the plot
  // edges — without that, the slowest chunk sits on the bottom edge and reads as clipping.
  function drawProfile() {
    if (chunks.length < 2) {
      return
    }
    const ghz = chunks.map(ms => toGhz(ITERS_PER_CALL, ms))
    const lo = Math.min(...ghz), hi = Math.max(...ghz)
    const span = (hi - lo) || 1
    const pad = span * 0.18

    const W = 240, H = 46, P = 3
    const x = i => P + i * (W - 2 * P) / (ghz.length - 1)
    const y = v => H - P - (v - lo + pad) / (span + 2 * pad) * (H - 2 * P)

    chart.innerHTML =
      `<polyline points="${ghz.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none"/>` +
      `<circle class="dot-a" cx="${x(0).toFixed(1)}" cy="${y(ghz[0]).toFixed(1)}" r="1.6"/>` +
      `<circle class="dot-b" cx="${x(ghz.length - 1).toFixed(1)}" cy="${y(ghz[ghz.length - 1]).toFixed(1)}" r="1.6"/>`

    rangeTxt.textContent = ' · ' + lo.toFixed(2) + '–' + hi.toFixed(2) + ' GHz'

    // Cursor-following readout. The whole plot is the hit area, so there are no
    // per-point targets to aim at. Attached after submit, so the timing window
    // never sees it. 160 is the tooltip's max width, used to keep it in view.
    chart.onmousemove = (e) => {
      const rect = chart.getBoundingClientRect()
      const n = chunks.length - 1
      const i = Math.min(n, Math.max(0, Math.round((e.clientX - rect.left) / rect.width * n)))
      chartTip.textContent = `chunk ${i + 1} · ${toGhz(ITERS_PER_CALL, chunks[i]).toFixed(2)} GHz`
      chartTip.style.left = Math.min(e.clientX + 12, innerWidth - 160) + 'px'
      chartTip.style.top = (e.clientY + 12) + 'px'
      chartTip.hidden = false
    }
    chart.onmouseleave = () => {
      chartTip.hidden = true
    }

    profileSec.hidden = false
  }

  navigator.wakeLock?.request('screen').catch(() => {})
  console.warn('DevTools open: measured values may be lower than reality')
</script>
</body>
</html>
