<!doctype html>
<html lang="en">
<head>
<title>CPU Race</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="description" content="Measure your CPU's effective clock, then race the global leaderboard">
<style>
  body {
    font-family: monospace;
    font-size: 13px;
  }
  table {
    border-collapse: collapse;
    margin: 0.5em 0;
  }
  #progressBar {
    width: 20em;
  }
  table, th, td {
    text-align: center;
    border: 1px solid #ccc;
    padding: 0.3em 0.6em;
  }
  .highlight {
    font-weight: bold;
    background: #eee;
  }
  #txtSpeed {
    font-size: 55px;
  }
  #visibilityWarn {
    color: #c00;
    margin: 0.5em 0;
  }
</style>
</head>
<body>
<div id="txtSpeed">0 GHz</div>
<div>
  <progress id="progressBar"></progress>
</div>
<div>
  <span id="txtState">...</span>
</div>
<div id="visibilityWarn" hidden>
  Tab switching detected! Measured values may be lower than reality. Reload to try again.
</div>
<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Total time</th>
      <th>Est. clock</th>
      <th>Location</th>
      <th>Date</th>
    </tr>
  </thead>
  <tbody id="tableRank"></tbody>
</table>
<script>
  const TOTAL_ITERS = 2.5e9
  const ITERS_PER_CALL = TOTAL_ITERS / 20

  const workerEnv = () => {
    const wasmB64 = 'AGFzbQEAAAABCQFgA35+fwJ+fgMCAQAHCQEFc29sdmUAAArAAQG9AQADQCAAIAGFQpXfi/S9qImaUX5CEYkhACABIACFQqOpz6HtxemZywB+QhOJIQEgACABhULTrdSykoW1tJ5/fkIViSEAIAEgAIVCpfGx08q545otfkIXiSEBIAAgAYVCldPH3rXyqdJGfkIZiSEAIAEgAIVCs+uwxNyUtJJLfkIbiSEBIAAgAYVCxc/ZsvHluuonfkIdiSEAIAEgAIVCrf7V5NSF/ajYAH5CH4khASACQQFrIgINAAsgACABCw=='
    const wasmBin = Uint8Array.from(atob(wasmB64), c => c.charCodeAt(0))
    const wasmMod = new WebAssembly.Module(wasmBin)
    const wasmObj = new WebAssembly.Instance(wasmMod)
    const {solve} = wasmObj.exports

    onmessage = (e) => {
      let [a, b] = e.data

      for (let done = 0; done < TOTAL_ITERS; done += ITERS_PER_CALL) {
        const t0 = performance.now()
        ; [a, b] = solve(a, b, ITERS_PER_CALL)
        const t1 = performance.now()

        postMessage(t1 - t0)
      }
      postMessage({
        type: 'done',
        a: a & 0xFFFFFFFFFFFFFFFFn,
        b: b & 0xFFFFFFFFFFFFFFFFn,
      })
    }
    // warmup
    solve(1n, 1n, 1e7)
    postMessage({type: 'ready'})
  }

  const workerCode = `
    const TOTAL_ITERS = ${TOTAL_ITERS}
    const ITERS_PER_CALL = ${ITERS_PER_CALL}
    ;(${workerEnv})()
  `
  const workerBlob = new Blob([workerCode])
  const workerUrl = URL.createObjectURL(workerBlob)
  const worker = new Worker(workerUrl)


  function formatSpeed(iter, timeMs) {
    const CYCLES_PER_ITER = 40
    return (iter * CYCLES_PER_ITER / timeMs / 1e6).toFixed(2) + ' GHz'
  }

  worker.onmessage = (e) => {
    const msg = e.data
    if (typeof msg === 'number') {
      const timeMs = msg
      // console.log('time:', timeMs)
      txtSpeed.textContent = formatSpeed(ITERS_PER_CALL, timeMs)
      progressBar.value += ITERS_PER_CALL
    } else {
      if (msg.type === 'ready') {
        connect()
      } else {
        console.timeEnd('solve')
        submit(msg.a, msg.b)
      }
    }
  }

  // const EDGE_URL = 'ws://localhost:8787/v1'
  const EDGE_URL = 'wss://cpu-race-cfworker.etherdream.com/v1'

  let msgId = 0
  let ws
  let rtt

  async function submit(a, b) {
    setState('Submitting...')
    console.log('answer:', a, b)
    document.onvisibilitychange = null

    const answer = BigUint64Array.of(a, b)
    ws.send(answer)
    rtt = Date.now()
  }

  function start(ques) {
    worker.postMessage(ques)
    console.log('question:', ...ques)
    console.time('solve')

    document.onvisibilitychange = () => {
      visibilityWarn.hidden = false
    }
    progressBar.max = TOTAL_ITERS
    progressBar.value = 0
    setState('Measuring CPU speed...')
  }

  function complete(json) {
    if (json.error) {
      setState(json.error)
      return
    }
    const prefix = `Your time: ${json.duration} ms (incl. ~${rtt} ms RTT)`

    if (json.rank === 0) {
      setState(`${prefix}, not ranked.`)
      return
    }
    setState(`${prefix}, ranked #${json.rankIndex}!`)
    updateRankTable(json.rank, json.rankIndex)
  }

  function updateRankTable(rank, rankIndex) {
    tableRank.innerHTML = ''

    rank.forEach((item, index) => {
      const row = document.createElement('tr')

      const speed = formatSpeed(TOTAL_ITERS, item.duration)
      const duration = item.duration + ' ms'
      const date = new Date(item.date).toLocaleString()

      for (const v of [index + 1, duration, speed, item.geo, date]) {
        const col = document.createElement('td')
        col.textContent = v
        row.appendChild(col)
      }
      tableRank.appendChild(row)
    })
    if (rankIndex) {
      tableRank.children[rankIndex - 1].classList.add('highlight')
    }
  }

  function setState(text) {
    txtState.textContent = text
  }

  function connect() {
    setState('Connecting to server...')
    ws = new WebSocket(EDGE_URL)

    ws.onopen = () => {
      console.log('WebSocket connection established.')
    }
    ws.onclose = () => {
      console.log('WebSocket connection closed.')
    }
    ws.onerror = () => {
      console.log('WebSocket connection error.')
      setState('Connection failed, reload to retry')
    }
    ws.onmessage = (e) => {
      const msg = e.data

      switch (msgId++) {
      case 0:
        start(new BigUint64Array(msg))
        break
      case 1:
        updateRankTable(JSON.parse(msg))
        break
      case 2:
        // The edge service replies with an empty message as soon as it receives the
        // answer, which lets us measure the RTT. Note this is the RTT of the answer
        // submission only; strictly we should measure question dispatch → answer submit.
        rtt = Date.now() - rtt
        break
      case 3:
        complete(JSON.parse(msg))
        break
      }
    }
    ws.binaryType = 'arraybuffer' 
  }

  navigator.wakeLock?.request('screen')
    .catch(() => {})

  console.warn('DevTools open: measured values may be lower than reality')
</script>

</body>
</html>
